name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC to AWS

env:
  AWS_REGION: eu-central-1

jobs:
  eval-gate:
    uses: ./.github/workflows/eval-gate.yml
    secrets: inherit

  build:
    needs: eval-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, mcp, airflow]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/sciagent/${{ matrix.image }}:${{ github.ref_name }}
            ${{ steps.ecr.outputs.registry }}/sciagent/${{ matrix.image }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: [staging, prod]
    environment: ${{ matrix.env }}   # prod requires manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@v4
      - run: aws eks update-kubeconfig --name sciagent-${{ matrix.env }}
      - name: Helm upgrade
        run: |
          VALUES=deploy/helm/sciagent/values-${{ matrix.env == 'prod' && 'prod' || 'dev' }}.yaml
          helm upgrade --install sciagent deploy/helm/sciagent \
            --namespace sciagent --create-namespace \
            -f "$VALUES" \
            --set environment=${{ matrix.env }} \
            --set api.image.tag=${{ github.sha }} \
            --set mcp.image.tag=${{ github.sha }} \
            --atomic --timeout 10m
      - name: Post-deploy smoke test
        run: |
          kubectl -n sciagent rollout status deploy/sciagent-api --timeout=5m
          kubectl -n sciagent run smoke-${{ github.run_id }} --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 -- curl -fsS http://sciagent-api:8000/readyz
