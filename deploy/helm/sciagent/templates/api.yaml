{{- if .Values.api.enabled }}
{{- $name := include "sciagent.componentName" (list $ "api") }}
{{- $api := .Values.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sciagent.componentLabels" (list $ "api") | nindent 4 }}
spec:
  {{- if not $api.autoscaling.enabled }}
  replicas: {{ $api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "sciagent.selectorLabels" (list $ "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sciagent.componentLabels" (list $ "api") | nindent 8 }}
      annotations:
        {{- include "sciagent.configChecksum" $ | nindent 8 }}
        {{- with $api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sciagent.serviceAccountName" (list $ $api.serviceAccount "api") }}
      # Token is projected only for IRSA (AWS SDK reads AWS_WEB_IDENTITY_TOKEN_FILE).
      automountServiceAccountToken: {{ $api.serviceAccount.automountToken }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $api.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "sciagent.podSecurityContext" (list $ $api.podSecurityContext) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "sciagent.image" (list $ $api.image) }}
          imagePullPolicy: {{ $api.image.pullPolicy }}
          command:
            {{- toYaml $api.command | nindent 12 }}
          {{- with $api.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $api.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "sciagent.componentName" (list $ "config") }}
            - secretRef:
                name: {{ include "sciagent.secretName" $ }}
          env:
            - name: SCIAGENT_SERVICE
              value: api
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TMPDIR
              value: /tmp
          livenessProbe:
            {{- toYaml $api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $api.resources | nindent 12 }}
          securityContext:
            {{- include "sciagent.containerSecurityContext" (list $ $api.containerSecurityContext) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      {{- with $api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sciagent.componentLabels" (list $ "api") | nindent 4 }}
spec:
  type: {{ $api.service.type }}
  selector:
    {{- include "sciagent.selectorLabels" (list $ "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ $api.service.port }}
      targetPort: http
      protocol: TCP
{{- if $api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "sciagent.componentLabels" (list $ "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $api.autoscaling.minReplicas }}
  maxReplicas: {{ $api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $api.autoscaling.targetCPUUtilizationPercentage }}
    {{- with $api.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
{{- end }}
{{- if $api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "sciagent.componentLabels" (list $ "api") | nindent 4 }}
spec:
  minAvailable: {{ $api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "sciagent.selectorLabels" (list $ "api") | nindent 6 }}
{{- end }}
{{- end }}
