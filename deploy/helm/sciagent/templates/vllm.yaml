{{- if .Values.vllm.enabled }}
{{- $name := include "sciagent.componentName" (list $ "vllm") }}
{{- $vllm := .Values.vllm }}
{{- $cache := $vllm.modelCache }}
{{- if and $cache.persistence.enabled (not $cache.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-model-cache
  labels:
    {{- include "sciagent.componentLabels" (list $ "vllm") | nindent 4 }}
  annotations:
    # Keep downloaded weights across helm uninstall / reinstall.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml $cache.persistence.accessModes | nindent 4 }}
  {{- with $cache.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $cache.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sciagent.componentLabels" (list $ "vllm") | nindent 4 }}
spec:
  {{- if not $vllm.autoscaling.enabled }}
  replicas: {{ $vllm.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    # Surge would need a spare GPU; replace pods one at a time instead.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "sciagent.selectorLabels" (list $ "vllm") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sciagent.componentLabels" (list $ "vllm") | nindent 8 }}
      {{- with $vllm.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sciagent.serviceAccountName" (list $ $vllm.serviceAccount "vllm") }}
      automountServiceAccountToken: {{ $vllm.serviceAccount.automountToken }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $vllm.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $vllm.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "sciagent.podSecurityContext" (list $ $vllm.podSecurityContext) | nindent 8 }}
      containers:
        - name: vllm
          image: {{ include "sciagent.image" (list $ $vllm.image) }}
          imagePullPolicy: {{ $vllm.image.pullPolicy }}
          # $(MODEL) is expanded by the kubelet from the env var below.
          args:
            - --model
            - $(MODEL)
            - --served-model-name
            - {{ .Values.config.llmModel | quote }}
            - --max-model-len
            - {{ $vllm.maxModelLen | quote }}
            - --gpu-memory-utilization
            - {{ $vllm.gpuMemoryUtilization | quote }}
            - --port
            - {{ $vllm.port | quote }}
            {{- with $vllm.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $vllm.port }}
              protocol: TCP
          env:
            - name: MODEL
              value: {{ $vllm.model | quote }}
            - name: HOME
              value: /tmp
            # No passwd entry for the runtime UID; torch uses $USER instead.
            - name: USER
              value: vllm
            - name: HF_HOME
              value: {{ $cache.mountPath }}
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            {{- if $vllm.huggingFaceToken.secretName }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $vllm.huggingFaceToken.secretName }}
                  key: {{ $vllm.huggingFaceToken.secretKey }}
            {{- end }}
          startupProbe:
            {{- toYaml $vllm.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $vllm.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $vllm.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml $vllm.resources | nindent 12 }}
          securityContext:
            {{- include "sciagent.containerSecurityContext" (list $ $vllm.containerSecurityContext) | nindent 12 }}
          volumeMounts:
            - name: model-cache
              mountPath: {{ $cache.mountPath }}
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          {{- if $cache.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $cache.persistence.existingClaim | default (printf "%s-model-cache" $name) }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $cache.sizeLimit }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $vllm.shmSizeLimit }}
      {{- with $vllm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $vllm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $vllm.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sciagent.componentLabels" (list $ "vllm") | nindent 4 }}
spec:
  type: {{ $vllm.service.type }}
  selector:
    {{- include "sciagent.selectorLabels" (list $ "vllm") | nindent 4 }}
  ports:
    - name: http
      port: {{ $vllm.service.port }}
      targetPort: http
      protocol: TCP
{{- if $vllm.autoscaling.enabled }}
---
# Scales on queue depth rather than GPU utilisation: requests waiting for a
# KV-cache slot are the direct signal that a replica is saturated. Requires
# prometheus-adapter to expose the metric via custom.metrics.k8s.io.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "sciagent.componentLabels" (list $ "vllm") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $vllm.autoscaling.minReplicas }}
  maxReplicas: {{ $vllm.autoscaling.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: {{ $vllm.autoscaling.metricName | quote }}
        target:
          type: AverageValue
          averageValue: {{ $vllm.autoscaling.targetAverageValue | quote }}
  behavior:
    scaleUp:
      # New GPU nodes take minutes; do not stack scale-ups while one is pending.
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
{{- end }}
{{- if $vllm.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "sciagent.componentLabels" (list $ "vllm") | nindent 4 }}
spec:
  maxUnavailable: {{ $vllm.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "sciagent.selectorLabels" (list $ "vllm") | nindent 6 }}
{{- end }}
{{- end }}
