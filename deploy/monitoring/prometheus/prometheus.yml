# Prometheus configuration for the local docker-compose stack.
# Expected mounts in the prometheus container:
#   deploy/monitoring/prometheus/prometheus.yml -> /etc/prometheus/prometheus.yml
#   deploy/monitoring/prometheus/rules/         -> /etc/prometheus/rules/
# In Kubernetes, scraping is configured by the chart's ServiceMonitors instead.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: local
    cluster: docker-compose

rule_files:
  - /etc/prometheus/rules/local-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sciagent-api
    metrics_path: /metrics
    # Keep the app-emitted `service` label if present.
    honor_labels: true
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: sciagent-mcp
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets: ["mcp-imaging:8101"]
        labels:
          service: mcp-imaging
      - targets: ["mcp-genomics:8102"]
        labels:
          service: mcp-genomics
      - targets: ["mcp-clinical:8103"]
        labels:
          service: mcp-clinical

  # Only present when the compose profile with a GPU / vLLM is enabled;
  # the target is simply reported as down otherwise.
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8001"]
        labels:
          service: vllm
