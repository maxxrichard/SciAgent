# Declarative pipeline catalogue. Airflow DAGs are generated from this file
# (dags/sciagent_pipelines.py); the same specs run locally via `sciagent pipelines run`.
pipelines:
- id: imaging-segmentation-site-a
  kind: imaging_segmentation
  modality: imaging
  group: imaging
  schedule: 0 1 * * *
  params:
    site: site-a
    samples:
    - IMG-0001
    - IMG-0002
    - IMG-0003
    - IMG-0004
    - IMG-0005
    - IMG-0006
    - IMG-0007
    - IMG-0008
  checks:
    min_rows: 1
    not_null:
    - sample_id
    - cell_count
    range:
      cell_count:
      - 0
      - 500
  description: Nucleus segmentation summaries for microscopy acquired at site-a.
- id: imaging-features-site-a
  kind: imaging_features
  modality: imaging
  group: imaging
  schedule: 30 1 * * *
  params:
    site: site-a
    samples:
    - IMG-0001
    - IMG-0002
    - IMG-0003
    - IMG-0004
    - IMG-0005
    - IMG-0006
    - IMG-0007
    - IMG-0008
  checks:
    min_rows: 1
    not_null:
    - sample_id
    - snr_db
    range:
      foreground_fraction:
      - 0
      - 1
  description: Intensity and texture features for microscopy acquired at site-a.
- id: genomics-variants-site-a
  kind: genomics_variants
  modality: genomics
  group: genomics
  schedule: 0 2 * * *
  params:
    site: site-a
    samples:
    - WGS-0001
    - WGS-0002
    - WGS-0003
    - WGS-0004
  checks:
    min_rows: 1
    not_null:
    - sample_id
    - gene
    - impact
    range:
      allele_freq:
      - 0
      - 1
  description: Annotated small variants from whole-genome sequencing at site-a.
- id: genomics-scrna-qc-site-a
  kind: scrna_qc
  modality: genomics
  group: genomics
  schedule: 30 2 * * *
  params:
    site: site-a
    samples:
    - SC-0001
    - SC-0002
    - SC-0003
    - SC-0004
  checks:
    min_rows: 1
    not_null:
    - sample_id
    range:
      pass_rate:
      - 0
      - 1
  description: Single-cell RNA-seq library QC metrics from site-a.
